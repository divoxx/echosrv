[package]
name = "echosrv"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Async echo servers and clients for TCP, UDP, HTTP and Unix domain sockets, built on Tokio"
license = "MIT"
repository = "https://github.com/divoxx/echosrv"
homepage = "https://github.com/divoxx/echosrv"
documentation = "https://docs.rs/echosrv"
readme = "README.md"
keywords = ["echo", "server", "tokio", "tcp", "udp"]
categories = ["network-programming", "asynchronous", "command-line-utilities"]
authors = ["Rodrigo Rafael Monti Kochenburger <rk@divoxx.me>"]
default-run = "echosrv"

[dependencies]
# The library needs net, io-util, time, sync, rt and macros. The binaries add
# rt-multi-thread (multi-threaded runtime) and signal (SIGINT/SIGTERM handling).
tokio = { version = "1.41.0", features = [
    "net",
    "io-util",
    "time",
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
thiserror = "2"
color-eyre = "0.6.2"
async-trait = "0.1.88"
httparse = "1.8"
tokio-util = "0.7"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
# Used by the echosrv-client binary.
colored = "2"
hdrhistogram = { version = "7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "echosrv"
path = "src/main.rs"

[[bin]]
name = "echosrv-client"
path = "src/bin/echosrv-client/main.rs"

[dev-dependencies]
# process: tests/cli.rs spawns the binaries; test-util: paused-clock tests.
tokio = { version = "1.32.0", features = ["process", "test-util"] }
tempfile = "3.8"
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
futures = "0.3"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[[bench]]
name = "echo_performance"
harness = false

